[project]
name = "opssight"
version = "0.1.0"
description = "Monitoring, diagnostics, and alerting service for NexusOps"
readme = "README.md"
authors = [
    { name = "dawidth17", email = "dawidth17@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
