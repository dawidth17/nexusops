name: Sentinel CI

on:
  push:
    paths:
      - "sentinel-agent/**"
      - ".github/workflows/sentinel-ci.yml"
  pull_request:
    paths:
      - "sentinel-agent/**"
      - ".github/workflows/sentinel-ci.yml"

jobs:
  cpp:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify build tools
        run: |
          gcc --version
          g++ --version
          cmake --version
          ninja --version

      - name: Configure SentinelAgent
        run: |
          cmake \
            -S sentinel-agent \
            -B sentinel-agent/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSENTINEL_BUILD_TESTS=ON

      - name: Build SentinelAgent
        run: |
          cmake \
            --build sentinel-agent/build \
            --parallel

      - name: Test SentinelAgent
        run: |
          ctest \
            --test-dir sentinel-agent/build \
            --output-on-failure

      - name: Run SentinelAgent
        run: |
          ./sentinel-agent/build/sentinel-agent