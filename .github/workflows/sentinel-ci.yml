name: Sentinel CI

on:
  push:
    paths:
      - "sentinel-agent/**"
      - ".github/workflows/sentinel-ci.yml"
  pull_request:
    paths:
      - "sentinel-agent/**"
      - ".github/workflows/sentinel-ci.yml"

jobs:
  cpp:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify build tools
        run: |
          gcc --version
          g++ --version
          cmake --version
          ninja --version
          pkg-config --version
          sqlite3 --version
          pkg-config --modversion sqlite3
          openssl version
          pkg-config --modversion openssl
          systemd-analyze --version

      - name: Configure SentinelAgent
        run: |
          cmake \
            -S sentinel-agent \
            -B sentinel-agent/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSENTINEL_BUILD_TESTS=ON

      - name: Build SentinelAgent
        run: |
          cmake \
            --build sentinel-agent/build \
            --parallel

      - name: Test SentinelAgent
        run: |
          ctest \
            --test-dir sentinel-agent/build \
            --output-on-failure

      - name: Run SentinelAgent
        run: |
          NEXUSOPS_SENTINEL_SPOOL_PATH="$RUNNER_TEMP/sentinel-ci.db" \
            ./sentinel-agent/build/sentinel-agent \
            --run-seconds 2

      - name: Test network diagnostics
        run: |
          python3 -m http.server \
            18080 \
            --bind 127.0.0.1 \
            >"$RUNNER_TEMP/http-server.log" 2>&1 &

          server_pid=$!

          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          sleep 1

          ./sentinel-agent/build/sentinel-agent \
            diagnose dns localhost

          ./sentinel-agent/build/sentinel-agent \
            diagnose tcp 127.0.0.1 18080

          ./sentinel-agent/build/sentinel-agent \
            diagnose http http://127.0.0.1:18080/

      - name: Test TLS diagnostics
        run: |
          tls_dir="$RUNNER_TEMP/sentinel-tls"

          mkdir -p "$tls_dir"

          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -sha256 \
            -nodes \
            -keyout "$tls_dir/key.pem" \
            -out "$tls_dir/cert.pem" \
            -days 2 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" \
            -addext "basicConstraints=critical,CA:TRUE"

          openssl s_server \
            -quiet \
            -accept 18443 \
            -cert "$tls_dir/cert.pem" \
            -key "$tls_dir/key.pem" \
            -www \
            >"$tls_dir/server.log" 2>&1 &

          server_pid=$!

          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          sleep 1

          ./sentinel-agent/build/sentinel-agent \
            diagnose tls \
            localhost \
            18443 \
            "$tls_dir/cert.pem"

          ./sentinel-agent/build/sentinel-agent \
            diagnose http \
            https://localhost:18443/ \
            "$tls_dir/cert.pem"

      - name: Test graceful SIGTERM
        run: |
          log_file="$RUNNER_TEMP/sentinel-sigterm.log"
          spool_file="$RUNNER_TEMP/sentinel-sigterm.db"

          NEXUSOPS_SENTINEL_SPOOL_PATH="$spool_file" \
            ./sentinel-agent/build/sentinel-agent \
            >"$log_file" 2>&1 &

          agent_pid=$!

          sleep 2

          kill -TERM "$agent_pid"

          wait "$agent_pid"

          cat "$log_file"

          grep -q \
            "shutdown_requested signal=SIGTERM" \
            "$log_file"

          grep -q \
            "graceful_shutdown=true" \
            "$log_file"

      - name: Verify systemd unit
        run: |
          sudo install \
            -m 0755 \
            sentinel-agent/build/sentinel-agent \
            /usr/bin/nexusops-sentinel-agent

          systemd-analyze verify \
            sentinel-agent/packaging/systemd/nexusops-sentinel.service