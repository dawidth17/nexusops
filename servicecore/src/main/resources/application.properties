spring.application.name=servicecore

spring.profiles.default=dev

spring.datasource.url=jdbc:postgresql://${SERVICECORE_DB_HOST:localhost}:${SERVICECORE_DB_PORT:5433}/${SERVICECORE_DB_NAME:servicecore}
spring.datasource.username=${SERVICECORE_DB_USER:servicecore}
spring.datasource.password=${SERVICECORE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

servicecore.kafka.enabled=${SERVICECORE_KAFKA_ENABLED:false}
servicecore.kafka.alert-topic=${SERVICECORE_KAFKA_ALERT_TOPIC:nexusops.opssight.alert-lifecycle.v1}
servicecore.kafka.consumer-group=${SERVICECORE_KAFKA_CONSUMER_GROUP:servicecore-alert-lifecycle-v1}

spring.kafka.bootstrap-servers=${SERVICECORE_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.consumer.group-id=${servicecore.kafka.consumer-group}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

management.endpoints.web.exposure.include=health,info
