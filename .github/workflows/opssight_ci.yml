name: OpsSight CI

on:
  push:
    paths:
      - "opssight/**"
      - ".github/workflows/opssight-ci.yml"
  pull_request:
    paths:
      - "opssight/**"
      - ".github/workflows/opssight-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: opssight

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Build package
        run: uv build

      - name: Run tests
        run: uv run pytest -v