name: nexusops-dev

services:
  servicecore-db:
    image: postgres:18.4

    environment:
      POSTGRES_DB: ${SERVICECORE_DB_NAME}
      POSTGRES_USER: ${SERVICECORE_DB_USER}
      POSTGRES_PASSWORD: ${SERVICECORE_DB_PASSWORD}

    ports:
      - "127.0.0.1:${SERVICECORE_DB_PORT}:5432"

    volumes:
      - servicecore-postgres-data:/var/lib/postgresql

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  opssight-db:
    image: timescale/timescaledb:2.29.2-pg18

    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb

    environment:
      POSTGRES_DB: ${OPSSIGHT_DB_NAME}
      POSTGRES_USER: ${OPSSIGHT_DB_USER}
      POSTGRES_PASSWORD: ${OPSSIGHT_DB_PASSWORD}

    ports:
      - "127.0.0.1:${OPSSIGHT_DB_PORT}:5432"

    volumes:
      - opssight-postgres-data:/var/lib/postgresql

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.5-management

    environment:
      RABBITMQ_DEFAULT_USER: ${OPSSIGHT_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${OPSSIGHT_RABBITMQ_PASSWORD}

    ports:
      - "127.0.0.1:${OPSSIGHT_RABBITMQ_PORT}:5672"
      - "127.0.0.1:${OPSSIGHT_RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

    networks:
      - backend

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  opssight-migrate:
    build:
      context: ../../opssight

    image: nexusops-opssight:dev

    command:
      - alembic
      - upgrade
      - head

    environment:
      OPSSIGHT_DB_HOST: opssight-db
      OPSSIGHT_DB_PORT: "5432"
      OPSSIGHT_DB_NAME: ${OPSSIGHT_DB_NAME}
      OPSSIGHT_DB_USER: ${OPSSIGHT_DB_USER}
      OPSSIGHT_DB_PASSWORD: ${OPSSIGHT_DB_PASSWORD}

    networks:
      - backend

    depends_on:
      opssight-db:
        condition: service_healthy

    restart: "no"

  opssight-api:
    build:
      context: ../../opssight

    image: nexusops-opssight:dev

    environment:
      OPSSIGHT_DB_HOST: opssight-db
      OPSSIGHT_DB_PORT: "5432"
      OPSSIGHT_DB_NAME: ${OPSSIGHT_DB_NAME}
      OPSSIGHT_DB_USER: ${OPSSIGHT_DB_USER}
      OPSSIGHT_DB_PASSWORD: ${OPSSIGHT_DB_PASSWORD}
      OPSSIGHT_RABBITMQ_HOST: rabbitmq
      OPSSIGHT_RABBITMQ_PORT: "5672"
      OPSSIGHT_RABBITMQ_USER: ${OPSSIGHT_RABBITMQ_USER}
      OPSSIGHT_RABBITMQ_PASSWORD: ${OPSSIGHT_RABBITMQ_PASSWORD}

    ports:
      - "127.0.0.1:${OPSSIGHT_API_PORT}:8000"

    networks:
      - backend

    depends_on:
      opssight-migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  opssight-worker:
    build:
      context: ../../opssight

    image: nexusops-opssight:dev

    command:
      - celery
      - -A
      - opssight.celery_app:celery_app
      - worker
      - --loglevel=INFO

    environment:
      OPSSIGHT_DB_HOST: opssight-db
      OPSSIGHT_DB_PORT: "5432"
      OPSSIGHT_DB_NAME: ${OPSSIGHT_DB_NAME}
      OPSSIGHT_DB_USER: ${OPSSIGHT_DB_USER}
      OPSSIGHT_DB_PASSWORD: ${OPSSIGHT_DB_PASSWORD}
      OPSSIGHT_RABBITMQ_HOST: rabbitmq
      OPSSIGHT_RABBITMQ_PORT: "5672"
      OPSSIGHT_RABBITMQ_USER: ${OPSSIGHT_RABBITMQ_USER}
      OPSSIGHT_RABBITMQ_PASSWORD: ${OPSSIGHT_RABBITMQ_PASSWORD}

    networks:
      - backend

    depends_on:
      opssight-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  opssight-scheduler:
    build:
      context: ../../opssight

    image: nexusops-opssight:dev

    command:
      - celery
      - -A
      - opssight.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule

    environment:
      OPSSIGHT_DB_HOST: opssight-db
      OPSSIGHT_DB_PORT: "5432"
      OPSSIGHT_DB_NAME: ${OPSSIGHT_DB_NAME}
      OPSSIGHT_DB_USER: ${OPSSIGHT_DB_USER}
      OPSSIGHT_DB_PASSWORD: ${OPSSIGHT_DB_PASSWORD}
      OPSSIGHT_RABBITMQ_HOST: rabbitmq
      OPSSIGHT_RABBITMQ_PORT: "5672"
      OPSSIGHT_RABBITMQ_USER: ${OPSSIGHT_RABBITMQ_USER}
      OPSSIGHT_RABBITMQ_PASSWORD: ${OPSSIGHT_RABBITMQ_PASSWORD}

    networks:
      - backend

    depends_on:
      opssight-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.14.0

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    networks:
      - backend

    depends_on:
      opssight-api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.0

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - backend

    depends_on:
      - prometheus

volumes:
  servicecore-postgres-data:
  opssight-postgres-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

networks:
  backend: