name: Sentinel CI

on:
  push:
    paths:
      - "sentinel-agent/**"
      - "contracts/protobuf/**"
      - ".github/workflows/sentinel-ci.yml"
  pull_request:
    paths:
      - "sentinel-agent/**"
      - "contracts/protobuf/**"
      - ".github/workflows/sentinel-ci.yml"

jobs:
  cpp:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Protobuf and gRPC tools
        run: |
          sudo apt-get update

          sudo apt-get install \
            -y \
            --no-install-recommends \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc

      - name: Verify build tools
        run: |
          gcc --version
          g++ --version
          cmake --version
          ninja --version
          pkg-config --version
          sqlite3 --version
          pkg-config --modversion sqlite3
          openssl version
          pkg-config --modversion openssl
          protoc --version
          command -v grpc_cpp_plugin
          pkg-config --modversion protobuf
          pkg-config --modversion grpc++
          systemd-analyze --version

      - name: Configure SentinelAgent
        run: |
          cmake \
            -S sentinel-agent \
            -B sentinel-agent/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSENTINEL_BUILD_TESTS=ON

      - name: Build SentinelAgent
        run: |
          cmake \
            --build sentinel-agent/build \
            --parallel

      - name: Test SentinelAgent
        run: |
          ctest \
            --test-dir sentinel-agent/build \
            --output-on-failure

      - name: Verify gRPC transport tests
        run: |
          test_list="$(
            ./sentinel-agent/build/sentinel_grpc_transport_tests \
              --gtest_list_tests
          )"

          printf '%s\n' "$test_list"

          grep -q \
            "acknowledgesSentRecords" \
            <<< "$test_list"

          grep -q \
            "keepsSpoolWhenServerIsUnavailable" \
            <<< "$test_list"

          grep -q \
            "reconnectsAndResendsSameBatchInOrder" \
            <<< "$test_list"

          ./sentinel-agent/build/sentinel_grpc_transport_tests

      - name: Run SentinelAgent offline
        run: |
          log_file="$RUNNER_TEMP/sentinel-offline.log"
          spool_file="$RUNNER_TEMP/sentinel-ci.db"

          NEXUSOPS_SENTINEL_SPOOL_PATH="$spool_file" \
          NEXUSOPS_SENTINEL_OPSSIGHT_ENDPOINT=127.0.0.1:59999 \
            ./sentinel-agent/build/sentinel-agent \
            --run-seconds 7 \
            >"$log_file" 2>&1

          cat "$log_file"

          grep -q \
            "transport status=transport_error" \
            "$log_file"

          grep -q \
            "graceful_shutdown=true" \
            "$log_file"

      - name: Verify Protobuf telemetry spool
        run: |
          database="$RUNNER_TEMP/sentinel-ci.db"

          test "$(
            sqlite3 "$database" \
              "SELECT COUNT(*) FROM telemetry_spool;"
          )" -ge 3

          test "$(
            sqlite3 "$database" \
              "SELECT COUNT(*) FROM telemetry_spool
               WHERE payload_format != 2;"
          )" = "0"

          test "$(
            sqlite3 "$database" \
              "SELECT COUNT(*) FROM telemetry_spool
               WHERE kind = 'system';"
          )" -ge 1

          test "$(
            sqlite3 "$database" \
              "SELECT COUNT(*) FROM telemetry_spool
               WHERE kind = 'network';"
          )" -ge 1

          test "$(
            sqlite3 "$database" \
              "SELECT COUNT(*) FROM telemetry_spool
               WHERE kind = 'processes';"
          )" -ge 1

      - name: Test network diagnostics
        run: |
          python3 -m http.server \
            18080 \
            --bind 127.0.0.1 \
            >"$RUNNER_TEMP/http-server.log" 2>&1 &

          server_pid=$!

          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          sleep 1

          ./sentinel-agent/build/sentinel-agent \
            diagnose dns localhost

          ./sentinel-agent/build/sentinel-agent \
            diagnose tcp 127.0.0.1 18080

          ./sentinel-agent/build/sentinel-agent \
            diagnose http http://127.0.0.1:18080/

      - name: Test TLS diagnostics
        run: |
          tls_dir="$RUNNER_TEMP/sentinel-tls"

          mkdir -p "$tls_dir"

          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -sha256 \
            -nodes \
            -keyout "$tls_dir/key.pem" \
            -out "$tls_dir/cert.pem" \
            -days 2 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" \
            -addext "basicConstraints=critical,CA:TRUE"

          openssl s_server \
            -quiet \
            -accept 18443 \
            -cert "$tls_dir/cert.pem" \
            -key "$tls_dir/key.pem" \
            -www \
            >"$tls_dir/server.log" 2>&1 &

          server_pid=$!

          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          sleep 1

          ./sentinel-agent/build/sentinel-agent \
            diagnose tls \
            localhost \
            18443 \
            "$tls_dir/cert.pem"

          ./sentinel-agent/build/sentinel-agent \
            diagnose http \
            https://localhost:18443/ \
            "$tls_dir/cert.pem"

      - name: Test graceful SIGTERM
        run: |
          log_file="$RUNNER_TEMP/sentinel-sigterm.log"
          spool_file="$RUNNER_TEMP/sentinel-sigterm.db"

          NEXUSOPS_SENTINEL_SPOOL_PATH="$spool_file" \
          NEXUSOPS_SENTINEL_OPSSIGHT_ENDPOINT=127.0.0.1:59999 \
            ./sentinel-agent/build/sentinel-agent \
            >"$log_file" 2>&1 &

          agent_pid=$!

          sleep 2

          kill -TERM "$agent_pid"

          wait "$agent_pid"

          cat "$log_file"

          grep -q \
            "shutdown_requested signal=SIGTERM" \
            "$log_file"

          grep -q \
            "graceful_shutdown=true" \
            "$log_file"

      - name: Verify systemd unit
        run: |
          sudo install \
            -m 0755 \
            sentinel-agent/build/sentinel-agent \
            /usr/bin/nexusops-sentinel-agent

          systemd-analyze verify \
            sentinel-agent/packaging/systemd/nexusops-sentinel.service

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Protobuf and gRPC tools
        run: |
          sudo apt-get update

          sudo apt-get install \
            -y \
            --no-install-recommends \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc

      - name: Configure sanitizer build
        run: |
          cmake \
            -S sentinel-agent \
            -B sentinel-agent/build-sanitizers \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSENTINEL_BUILD_TESTS=ON \
            -DSENTINEL_ENABLE_SANITIZERS=ON

      - name: Build with sanitizers
        run: |
          cmake \
            --build sentinel-agent/build-sanitizers \
            --parallel

      - name: Test with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest \
            --test-dir sentinel-agent/build-sanitizers \
            --output-on-failure

      - name: Run agent with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          NEXUSOPS_SENTINEL_SPOOL_PATH: ${{ runner.temp }}/sentinel-sanitizers.db
          NEXUSOPS_SENTINEL_OPSSIGHT_ENDPOINT: 127.0.0.1:59999
        run: |
          ./sentinel-agent/build-sanitizers/sentinel-agent \
            --run-seconds 2

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Protobuf and gRPC tools
        run: |
          sudo apt-get update

          sudo apt-get install \
            -y \
            --no-install-recommends \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc

      - name: Verify clang-tidy
        run: |
          clang-tidy-18 --version

      - name: Install cppcheck
        run: |
          if ! command -v cppcheck >/dev/null 2>&1; then
            sudo apt-get install \
              -y \
              --no-install-recommends \
              cppcheck
          fi

          cppcheck --version

      - name: Configure analysis database
        run: |
          cmake \
            -S sentinel-agent \
            -B sentinel-agent/build-analysis \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSENTINEL_BUILD_TESTS=OFF

      - name: Generate analysis Protobuf sources
        run: |
          cmake \
            --build sentinel-agent/build-analysis \
            --target nexusops_telemetry_contract \
            --parallel

      - name: Run clang-tidy
        run: |
          mapfile -d '' source_files < <(
            find \
              sentinel-agent/app \
              sentinel-agent/src \
              -type f \
              \( -name '*.c' -o -name '*.cpp' \) \
              -print0
          )

          clang-tidy-18 \
            -p sentinel-agent/build-analysis \
            "${source_files[@]}"

      - name: Run cppcheck
        run: |
          cppcheck \
            --project=sentinel-agent/build-analysis/compile_commands.json \
            -isentinel-agent/build-analysis/generated \
            --suppress='preprocessorErrorDirective:sentinel-agent/build-analysis/generated/nexusops/telemetry/v1/telemetry.pb.h' \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem

  debian-package:
    name: Debian package
    runs-on: ubuntu-24.04
    needs:
      - cpp
      - sanitizers
      - static-analysis

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Protobuf and gRPC tools
        run: |
          sudo apt-get update

          sudo apt-get install \
            -y \
            --no-install-recommends \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler \
            protobuf-compiler-grpc

      - name: Verify packaging tools
        run: |
          cmake --version
          cpack --version
          ninja --version
          dpkg --version
          dpkg-deb --version
          dpkg-shlibdeps --version

      - name: Configure release package
        run: |
          cmake \
            -S sentinel-agent \
            -B sentinel-agent/build/package \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSENTINEL_BUILD_TESTS=OFF \
            -DSENTINEL_ENABLE_SANITIZERS=OFF

      - name: Build release binary
        run: |
          cmake \
            --build sentinel-agent/build/package \
            --parallel

      - name: Build Debian package
        run: |
          cpack \
            --config sentinel-agent/build/package/CPackConfig.cmake \
            -G DEB

          package_file="$(
            find \
              sentinel-agent/build/package/packages \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -print \
              -quit
          )"

          test -n "$package_file"

          echo "PACKAGE_FILE=$package_file" >> "$GITHUB_ENV"

      - name: Inspect Debian package
        run: |
          dpkg-deb \
            --info \
            "$PACKAGE_FILE"

          dpkg-deb \
            --contents \
            "$PACKAGE_FILE"

          dpkg-deb \
            --field \
            "$PACKAGE_FILE" \
            Package Version Architecture Depends

          test "$(
            dpkg-deb \
              --field \
              "$PACKAGE_FILE" \
              Package
          )" = "nexusops-sentinel-agent"

          dpkg-deb \
            --contents \
            "$PACKAGE_FILE" \
            | grep -q \
              './usr/bin/nexusops-sentinel-agent'

          dpkg-deb \
            --contents \
            "$PACKAGE_FILE" \
            | grep -q \
              './usr/lib/systemd/system/nexusops-sentinel.service'

          dpkg-deb \
            --contents \
            "$PACKAGE_FILE" \
            | grep -q \
              './etc/nexusops-sentinel/sentinel.conf'

      - name: Install Debian package
        run: |
          sudo dpkg \
            -i \
            "$PACKAGE_FILE"

          test -x \
            /usr/bin/nexusops-sentinel-agent

          test -f \
            /usr/lib/systemd/system/nexusops-sentinel.service

          test -f \
            /etc/nexusops-sentinel/sentinel.conf

          systemd-analyze verify \
            /usr/lib/systemd/system/nexusops-sentinel.service

      - name: Test packaged systemd service
        run: |
          sudo systemctl daemon-reload

          sudo systemctl start \
            nexusops-sentinel.service

          sleep 3

          sudo systemctl is-active \
            --quiet \
            nexusops-sentinel.service

          sudo systemctl stop \
            nexusops-sentinel.service

          result="$(
            sudo systemctl show \
              nexusops-sentinel.service \
              --property=Result \
              --value
          )"

          status="$(
            sudo systemctl show \
              nexusops-sentinel.service \
              --property=ExecMainStatus \
              --value
          )"

          test "$result" = "success"
          test "$status" = "0"

          sudo journalctl \
            -u nexusops-sentinel.service \
            --since "5 minutes ago" \
            --no-pager \
            | tee "$RUNNER_TEMP/package-service.log"

          grep -q \
            "SentinelAgent 0.9.0" \
            "$RUNNER_TEMP/package-service.log"

          grep -q \
            "graceful_shutdown=true" \
            "$RUNNER_TEMP/package-service.log"

      - name: Test package removal
        run: |
          sudo dpkg \
            -r \
            nexusops-sentinel-agent

          test ! -e \
            /usr/bin/nexusops-sentinel-agent

          test ! -e \
            /usr/lib/systemd/system/nexusops-sentinel.service

          test -f \
            /etc/nexusops-sentinel/sentinel.conf

          sudo dpkg \
            -P \
            nexusops-sentinel-agent

          test ! -e \
            /etc/nexusops-sentinel/sentinel.conf

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: nexusops-sentinel-agent-deb
          path: sentinel-agent/build/package/packages/*.deb
          if-no-files-found: error
          archive: false