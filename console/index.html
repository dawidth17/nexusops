<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>NexusOps Console</title>

    <link
        rel="stylesheet"
        href="/styles.css"
    >
</head>

<body>
    <main class="shell">
        <section class="card">
            <header>
                <p class="eyebrow">
                    NexusOps
                </p>

                <h1>
                    Operator Console
                </h1>

                <p class="description">
                    Shared Keycloak authentication
                    for NexusOps services.
                </p>
            </header>

            <div
                id="status"
                class="status"
                aria-live="polite"
            >
                Initializing authentication...
            </div>

            <dl
                id="identity"
                class="identity"
                hidden
            >
                <div>
                    <dt>User</dt>
                    <dd id="username">-</dd>
                </div>

                <div>
                    <dt>Subject</dt>
                    <dd id="subject">-</dd>
                </div>

                <div>
                    <dt>Roles</dt>
                    <dd id="roles">-</dd>
                </div>
            </dl>

            <div class="actions">
                <button
                    id="login"
                    type="button"
                >
                    Sign in
                </button>

                <button
                    id="logout"
                    type="button"
                    class="secondary"
                    hidden
                >
                    Sign out
                </button>
            </div>
        </section>
    </main>

    <script src="/config.js"></script>
    <script
        src="/app.js"
        defer
    ></script>
</body>
</html>
