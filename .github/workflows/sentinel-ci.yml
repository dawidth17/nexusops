name: Sentinel CI

on:
  push:
    paths:
      - "sentinel-agent/**"
      - ".github/workflows/sentinel-ci.yml"
  pull_request:
    paths:
      - "sentinel-agent/**"
      - ".github/workflows/sentinel-ci.yml"

jobs:
  cpp:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify build tools
        run: |
          gcc --version
          g++ --version
          cmake --version
          ninja --version
          pkg-config --version
          sqlite3 --version
          pkg-config --modversion sqlite3
          systemd-analyze --version

      - name: Configure SentinelAgent
        run: |
          cmake \
            -S sentinel-agent \
            -B sentinel-agent/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSENTINEL_BUILD_TESTS=ON

      - name: Build SentinelAgent
        run: |
          cmake \
            --build sentinel-agent/build \
            --parallel

      - name: Test SentinelAgent
        run: |
          ctest \
            --test-dir sentinel-agent/build \
            --output-on-failure

      - name: Run SentinelAgent
        run: |
          NEXUSOPS_SENTINEL_SPOOL_PATH="$RUNNER_TEMP/sentinel-ci.db" \
            ./sentinel-agent/build/sentinel-agent \
            --run-seconds 2

      - name: Test graceful SIGTERM
        run: |
          log_file="$RUNNER_TEMP/sentinel-sigterm.log"
          spool_file="$RUNNER_TEMP/sentinel-sigterm.db"

          NEXUSOPS_SENTINEL_SPOOL_PATH="$spool_file" \
            ./sentinel-agent/build/sentinel-agent \
            >"$log_file" 2>&1 &

          agent_pid=$!

          sleep 2

          kill -TERM "$agent_pid"

          wait "$agent_pid"

          cat "$log_file"

          grep -q \
            "shutdown_requested signal=SIGTERM" \
            "$log_file"

          grep -q \
            "graceful_shutdown=true" \
            "$log_file"

      - name: Verify systemd unit
        run: |
          sudo install \
            -m 0755 \
            sentinel-agent/build/sentinel-agent \
            /usr/bin/nexusops-sentinel-agent

          systemd-analyze verify \
            sentinel-agent/packaging/systemd/nexusops-sentinel.service