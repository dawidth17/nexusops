name: nexusops-dev

services:
  servicecore-db:
    image: postgres:18.4

    environment:
      POSTGRES_DB: ${SERVICECORE_DB_NAME}
      POSTGRES_USER: ${SERVICECORE_DB_USER}
      POSTGRES_PASSWORD: ${SERVICECORE_DB_PASSWORD}

    ports:
      - "127.0.0.1:${SERVICECORE_DB_PORT}:5432"

    volumes:
      - servicecore-postgres-data:/var/lib/postgresql

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  opssight-db:
    image: timescale/timescaledb:2.29.2-pg18

    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb

    environment:
      POSTGRES_DB: ${OPSSIGHT_DB_NAME}
      POSTGRES_USER: ${OPSSIGHT_DB_USER}
      POSTGRES_PASSWORD: ${OPSSIGHT_DB_PASSWORD}

    ports:
      - "127.0.0.1:${OPSSIGHT_DB_PORT}:5432"

    volumes:
      - opssight-postgres-data:/var/lib/postgresql

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.5-management

    environment:
      RABBITMQ_DEFAULT_USER: ${OPSSIGHT_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${OPSSIGHT_RABBITMQ_PASSWORD}

    ports:
      - "127.0.0.1:${OPSSIGHT_RABBITMQ_PORT}:5672"
      - "127.0.0.1:${OPSSIGHT_RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

    networks:
      - backend

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  kafka:
    image: apache/kafka:4.3.0
    hostname: kafka

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:${KAFKA_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    ports:
      - "127.0.0.1:${KAFKA_PORT}:9092"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:19092 >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.0

    entrypoint:
      - /bin/sh
      - /opt/nexusops/create-topics.sh

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      NEXUSOPS_KAFKA_ALERT_TOPIC: ${NEXUSOPS_KAFKA_ALERT_TOPIC}
      NEXUSOPS_KAFKA_INCIDENT_TOPIC: ${NEXUSOPS_KAFKA_INCIDENT_TOPIC}

    volumes:
      - ../kafka/create-topics.sh:/opt/nexusops/create-topics.sh:ro

    networks:
      - backend

    depends_on:
      kafka:
        condition: service_healthy

    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2

    command:
      - start-dev
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    ports:
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"

    volumes:
      - ../keycloak/realm:/opt/keycloak/data/import:ro

    networks:
      - backend

  servicecore-api:
    build:
      context: ../../servicecore
      dockerfile: Dockerfile

    image: nexusops-servicecore:dev

    environment:
      SPRING_PROFILES_ACTIVE: oidc

      SERVICECORE_DB_HOST: servicecore-db
      SERVICECORE_DB_PORT: "5432"
      SERVICECORE_DB_NAME: ${SERVICECORE_DB_NAME}
      SERVICECORE_DB_USER: ${SERVICECORE_DB_USER}
      SERVICECORE_DB_PASSWORD: ${SERVICECORE_DB_PASSWORD}

      NEXUSOPS_OIDC_ISSUER_URI: ${NEXUSOPS_OIDC_ISSUER_URI}
      NEXUSOPS_OIDC_JWK_SET_URI: http://keycloak:8080/realms/nexusops/protocol/openid-connect/certs
      NEXUSOPS_OIDC_CLIENT_ID: servicecore

    ports:
      - "127.0.0.1:${SERVICECORE_API_PORT}:8080"

    networks:
      - backend

    depends_on:
      servicecore-db:
        condition: service_healthy

      keycloak:
        condition: service_started

  opssight-migrate:
    build:
      context: ../..
      dockerfile: opssight/Dockerfile

    image: nexusops-opssight:dev

    command:
      - alembic
      - upgrade
      - head

    environment:
      OPSSIGHT_DB_HOST: opssight-db
      OPSSIGHT_DB_PORT: "5432"
      OPSSIGHT_DB_NAME: ${OPSSIGHT_DB_NAME}
      OPSSIGHT_DB_USER: ${OPSSIGHT_DB_USER}
      OPSSIGHT_DB_PASSWORD: ${OPSSIGHT_DB_PASSWORD}

    networks:
      - backend

    depends_on:
      opssight-db:
        condition: service_healthy

    restart: "no"

  opssight-api:
    build:
      context: ../..
      dockerfile: opssight/Dockerfile

    image: nexusops-opssight:dev

    environment:
      OPSSIGHT_DB_HOST: opssight-db
      OPSSIGHT_DB_PORT: "5432"
      OPSSIGHT_DB_NAME: ${OPSSIGHT_DB_NAME}
      OPSSIGHT_DB_USER: ${OPSSIGHT_DB_USER}
      OPSSIGHT_DB_PASSWORD: ${OPSSIGHT_DB_PASSWORD}

      OPSSIGHT_RABBITMQ_HOST: rabbitmq
      OPSSIGHT_RABBITMQ_PORT: "5672"
      OPSSIGHT_RABBITMQ_USER: ${OPSSIGHT_RABBITMQ_USER}
      OPSSIGHT_RABBITMQ_PASSWORD: ${OPSSIGHT_RABBITMQ_PASSWORD}

      OPSSIGHT_GRPC_HOST: "0.0.0.0"
      OPSSIGHT_GRPC_PORT: "50051"

      OPSSIGHT_OIDC_ENABLED: "true"
      OPSSIGHT_OIDC_ISSUER: ${NEXUSOPS_OIDC_ISSUER_URI}
      OPSSIGHT_OIDC_JWKS_URL: http://keycloak:8080/realms/nexusops/protocol/openid-connect/certs
      OPSSIGHT_OIDC_CLIENT_ID: opssight

    ports:
      - "127.0.0.1:${OPSSIGHT_API_PORT}:8000"
      - "127.0.0.1:${OPSSIGHT_GRPC_PORT}:50051"

    networks:
      - backend

    depends_on:
      opssight-migrate:
        condition: service_completed_successfully

      keycloak:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  opssight-worker:
    build:
      context: ../..
      dockerfile: opssight/Dockerfile

    image: nexusops-opssight:dev

    command:
      - celery
      - -A
      - opssight.celery_app:celery_app
      - worker
      - --loglevel=INFO

    environment:
      OPSSIGHT_DB_HOST: opssight-db
      OPSSIGHT_DB_PORT: "5432"
      OPSSIGHT_DB_NAME: ${OPSSIGHT_DB_NAME}
      OPSSIGHT_DB_USER: ${OPSSIGHT_DB_USER}
      OPSSIGHT_DB_PASSWORD: ${OPSSIGHT_DB_PASSWORD}

      OPSSIGHT_RABBITMQ_HOST: rabbitmq
      OPSSIGHT_RABBITMQ_PORT: "5672"
      OPSSIGHT_RABBITMQ_USER: ${OPSSIGHT_RABBITMQ_USER}
      OPSSIGHT_RABBITMQ_PASSWORD: ${OPSSIGHT_RABBITMQ_PASSWORD}

      OPSSIGHT_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      OPSSIGHT_KAFKA_ALERT_TOPIC: ${NEXUSOPS_KAFKA_ALERT_TOPIC}

    networks:
      - backend

    depends_on:
      opssight-migrate:
        condition: service_completed_successfully

      rabbitmq:
        condition: service_healthy

  opssight-scheduler:
    build:
      context: ../..
      dockerfile: opssight/Dockerfile

    image: nexusops-opssight:dev

    command:
      - celery
      - -A
      - opssight.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule

    environment:
      OPSSIGHT_DB_HOST: opssight-db
      OPSSIGHT_DB_PORT: "5432"
      OPSSIGHT_DB_NAME: ${OPSSIGHT_DB_NAME}
      OPSSIGHT_DB_USER: ${OPSSIGHT_DB_USER}
      OPSSIGHT_DB_PASSWORD: ${OPSSIGHT_DB_PASSWORD}

      OPSSIGHT_RABBITMQ_HOST: rabbitmq
      OPSSIGHT_RABBITMQ_PORT: "5672"
      OPSSIGHT_RABBITMQ_USER: ${OPSSIGHT_RABBITMQ_USER}
      OPSSIGHT_RABBITMQ_PASSWORD: ${OPSSIGHT_RABBITMQ_PASSWORD}

    networks:
      - backend

    depends_on:
      opssight-migrate:
        condition: service_completed_successfully

      rabbitmq:
        condition: service_healthy

  console:
    build:
      context: ../../console
      dockerfile: Dockerfile

    image: nexusops-console:dev

    ports:
      - "127.0.0.1:${CONSOLE_PORT}:80"

    networks:
      - backend

    depends_on:
      keycloak:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.14.0

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    networks:
      - backend

    depends_on:
      opssight-api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.0

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - backend

    depends_on:
      - prometheus

volumes:
  servicecore-postgres-data:
  opssight-postgres-data:
  rabbitmq-data:
  kafka-data:
  prometheus-data:
  grafana-data:

networks:
  backend: