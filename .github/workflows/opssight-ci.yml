name: OpsSight CI

on:
  push:
    paths:
      - "opssight/**"
      - ".github/workflows/opssight-ci.yml"
  pull_request:
    paths:
      - "opssight/**"
      - ".github/workflows/opssight-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      OPSSIGHT_DB_HOST: 127.0.0.1
      OPSSIGHT_DB_PORT: 5432
      OPSSIGHT_DB_NAME: opssight_test
      OPSSIGHT_DB_USER: opssight
      OPSSIGHT_DB_PASSWORD: opssight_test_password

    services:
      postgres:
        image: postgres:18.4

        env:
          POSTGRES_DB: opssight_test
          POSTGRES_USER: opssight
          POSTGRES_PASSWORD: opssight_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U opssight -d opssight_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: opssight

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Build package
        run: uv build

      - name: Run tests
        run: uv run pytest -v