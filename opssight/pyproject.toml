[project]
name = "opssight"
version = "0.1.0"
description = "Monitoring, diagnostics, and alerting service for NexusOps"
readme = "README.md"
authors = [
    { name = "dawidth17", email = "dawidth17@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "celery>=5.6.3,<6",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"src/opssight/api/v1/*.py" = ["B008"]
"src/opssight/auth/dependencies.py" = ["B008"]
"tests/test_auth_dependencies.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
]
ignore_missing_imports = true