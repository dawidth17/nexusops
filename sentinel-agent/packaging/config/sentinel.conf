# persistent sqlite spool used by the sentinel service
NEXUSOPS_SENTINEL_SPOOL_PATH=/var/lib/nexusops-sentinel/telemetry.db

# opssight grpc endpoint
NEXUSOPS_SENTINEL_OPSSIGHT_ENDPOINT=127.0.0.1:50051

# mutual tls is enabled after certificate enrollment
NEXUSOPS_SENTINEL_OPSSIGHT_MTLS_ENABLED=false

# certificate paths used when mutual tls is enabled
# NEXUSOPS_SENTINEL_OPSSIGHT_MTLS_CA_CERT_PATH=/etc/nexusops-sentinel/mtls/ca.cert.pem
# NEXUSOPS_SENTINEL_OPSSIGHT_MTLS_CLIENT_CERT_PATH=/etc/nexusops-sentinel/mtls/client.cert.pem
# NEXUSOPS_SENTINEL_OPSSIGHT_MTLS_CLIENT_KEY_PATH=/etc/nexusops-sentinel/mtls/client.key.pem

# optional stable identity overrides
# the configured agent id must match the client certificate common name
# NEXUSOPS_SENTINEL_AGENT_ID=sentinel-hostname
# NEXUSOPS_SENTINEL_HOSTNAME=hostname